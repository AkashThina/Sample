<div class="icon-wrapper">
  <mat-icon class="user-icon">account_circle</mat-icon>
</div>

<div class="signup-container mt-5">
  <!-- Left Red Half -->
  <div class="left-side">
    <h2>Welcome!</h2>
    <p>Create your account</p>
  </div>

  <!-- Right White Half -->
  <div class="right-side">
    <div class="form-wrapper">

      <h2 class="text-danger mt-4">Sign Up</h2>

      <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">

        <mat-form-field  class="full-width">
          <mat-label>Full Name</mat-label>
          <input matInput formControlName="fullName">
          <mat-error *ngIf="signupForm.get('fullName')?.touched && signupForm.get('fullName')?.invalid">
            Full Name is required
          </mat-error>
        </mat-form-field>

        <mat-form-field  class="full-width">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email">
          <mat-error *ngIf="signupForm.get('email')?.touched && signupForm.get('email')?.invalid">
            Valid Email is required
          </mat-error>
        </mat-form-field>

        <mat-form-field  class="full-width">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password">
        </mat-form-field>

        <mat-form-field  class="full-width">
          <mat-label>Confirm Password</mat-label>
          <input matInput type="password" formControlName="confirmPassword">
          <mat-error *ngIf="signupForm.errors && signupForm.get('confirmPassword')?.touched">
            Passwords do not match
          </mat-error>
        </mat-form-field>

        <button mat-raised-button color="primary" class="full-width" type="submit">
          Sign Up
        </button>

        <p class="mt-4 bottom-text">
          Already have an account? 
          <a class="" routerLink="/login">Login</a>
        </p>

      </form>

    </div>
  </div>
</div>
